[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "django-portlets"
dynamic = ["version"]
description = "Generic portlets for Django."
readme = "README.txt"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kai Diefenbach" }]
keywords = ["django", "portlets"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
]

[project.urls]
Source = "https://github.com/diefenbach/django-portlets"

[tool.setuptools.packages.find]
include = ["portlets*"]

[tool.setuptools.dynamic]
version = { attr = "portlets.__version__" }
